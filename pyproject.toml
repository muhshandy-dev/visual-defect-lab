[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-defect-lab"
version = "0.1.0"
description = "Deteksi dan lokalisasi cacat visual pada VisA: baseline klasik OpenCV vs PatchCore, dengan model ONNX int8 untuk browser."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
# PyTorch dipisah agar CI bisa memasang versi CPU dari indeks PyTorch.
model = ["torch>=2.4", "timm>=1.0", "onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
defect-lab = "defect_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["model: butuh PyTorch dan timm"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks", "web"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
